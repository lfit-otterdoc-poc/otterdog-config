---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: 'Otterdog Apply'

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

permissions: {}

jobs:
  apply:
    name: 'Apply Otterdog Configuration'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions/.github//.github/harden-runner/lfreleng-actions/allow_list.txt@18d9c4446bea555d0783e850f6d295f844fe8f67'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install Otterdog'
        uses: ./.github/actions/install-otterdog

      - name: 'Apply Otterdog configuration'
        uses: ./.github/actions/otterdog-apply
        with:
          organization: 'lfit-otterdoc-poc'
        env:
          OTTER_API_TOKEN: ${{ secrets.OTTER_API_TOKEN }}

      - name: 'Verify Otterdog configuration status'
        uses: ./.github/actions/otterdog-check-status
        with:
          organization: 'lfit-otterdoc-poc'
        env:
          OTTER_API_TOKEN: ${{ secrets.OTTER_API_TOKEN }}
