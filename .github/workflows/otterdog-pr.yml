---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: 'Otterdog PR Validation'

# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  resolve:
    name: 'Resolve Otterdog Configuration'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      # Load the LF Release Engineering egress allow-list before
      # harden-runner enables block mode.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          # This POC lives outside the lfreleng-actions organization, so the
          # allow-list source must be explicitly qualified.
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions/.github//.github/harden-runner/lfreleng-actions/allow_list.txt@18d9c4446bea555d0783e850f6d295f844fe8f67'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Pull-request content is untrusted. This workflow is intentionally
      # secretless: it never exposes any GitHub credential while evaluating
      # pull-request-controlled Jsonnet. Authenticated work happens only in
      # the trusted 'Otterdog Plan Comment' companion, against the inert JSON
      # produced below.
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Install the fixed Otterdog version directly rather than executing
      # repository-local composite actions from the pull-request checkout.
      - name: 'Install Otterdog'
        shell: bash
        run: |
          set -euo pipefail

          pipx install "otterdog==1.4.0"

          pipx_bin_dir="$(pipx environment --value PIPX_BIN_DIR)"

          "$pipx_bin_dir/otterdog" --version

      # Resolve the pull-request organization configuration to inert JSON.
      # Producing the JSON here, with no secrets in the environment, is safe
      # even though the Jsonnet is untrusted: nothing sensitive is present to
      # read. Pure JSON has no imports, so the trusted companion can plan
      # against it without ever re-evaluating pull-request-controlled Jsonnet
      # while the privileged OTTER_API_TOKEN is available. A Jsonnet syntax or
      # evaluation error fails this step, giving pull-request authors immediate
      # feedback.
      - name: 'Resolve organization configuration to inert JSON'
        shell: bash
        run: |
          set -euo pipefail

          pipx_home="$(pipx environment --value PIPX_HOME)"
          venv_python="${pipx_home}/venvs/otterdog/bin/python"

          mkdir -p pr-metadata

          # Vendor Otterdog's base template (a public repository, no token) and
          # then evaluate the organization configuration with Otterdog's own
          # Jsonnet evaluator, so the resolved JSON matches what Otterdog
          # produces internally.
          "$venv_python" - <<'PY'
          import asyncio
          import json
          import os

          from otterdog.config import OtterdogConfig
          from otterdog.utils import jsonnet_evaluate_file

          organization = "lfit-otterdoc-poc"

          config = OtterdogConfig.from_file("otterdog.json", False)
          org_config = config.get_organization_config(organization)
          jsonnet_config = org_config.jsonnet_config

          # Materialize the vendored base template (public, unauthenticated).
          asyncio.run(jsonnet_config.init_template())

          data = jsonnet_evaluate_file(jsonnet_config.org_config_file)

          os.makedirs("pr-metadata", exist_ok=True)
          out_path = "pr-metadata/resolved-org.json"
          with open(out_path, "w", encoding="utf-8") as fh:
              json.dump(data, fh)
          PY

      # Record the pull-request number so the trusted, privileged
      # `workflow_run` companion knows which pull request to plan and comment
      # on. This is the only control data handed across the trust boundary.
      - name: 'Record pull-request number'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "$PR_NUMBER" > pr-metadata/pr-number.txt

      - name: 'Upload pull-request metadata'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: 'pr-metadata'
          path: 'pr-metadata'
          retention-days: 1
