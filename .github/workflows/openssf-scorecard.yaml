name: "OpenSSF Scorecard"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  # For Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Ensure the Maintained check is refreshed periodically.
  schedule:
    - cron: "50 4 * * 0"
  push:
    branches: ["main"]

permissions: {}

jobs:
  openssf-scorecard:
    name: "OpenSSF Scorecard"
    # yamllint disable-line rule:line-length
    uses: lfit/releng-reusable-workflows/.github/workflows/reuse-openssf-scorecard.yaml@87eacd1f8322263ebbc1411ce2ea82bab10ed091  # v0.10.3
    permissions:
      contents: read
      security-events: write
      id-token: write
