name: "Install Otterdog"
description: "Install and verify the Otterdog CLI"

runs:
  using: "composite"
  steps:
    - name: "Install Otterdog"
      shell: bash

      # The only environment-file write adds the pipx application
      # directory to GITHUB_PATH. The value comes directly from pipx,
      # not from workflow input or other untrusted data.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail

        # Install Otterdog
        pipx install "otterdog==1.4.0"

        # Locate the pipx application directory
        pipx_bin_dir="$(pipx environment --value PIPX_BIN_DIR)"

        # Make Otterdog available to later workflow steps
        echo "$pipx_bin_dir" >> "$GITHUB_PATH"

        # Verify the installation
        "$pipx_bin_dir/otterdog" --version
