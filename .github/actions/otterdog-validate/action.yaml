name: "Validate Otterdog Configuration"
description: >-
  Validate the complete Otterdog configuration for a GitHub organization,
  including organization settings and managed resources such as repositories
  and teams.

inputs:
  organization:
    description: "Organization name to validate""
    required: true

runs:
  using: "composite"
  steps:
    - name: "Validate Otterdog configuration"
      shell: bash
      env:
        INPUT_ORGANIZATION: ${{ inputs.organization }}
      run: |
        # Validate the organization configuration
        otterdog validate "$INPUT_ORGANIZATION"
